name: Update forge-micro

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Bump forge-micro
        id: bump
        shell: bash
        run: |
          git submodule update --remote forge-micro
          if git diff --quiet -- forge-micro; then
            echo "forge-micro is already at the latest commit"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rev=$(git -C forge-micro rev-parse --short=8 HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "forge-micro: bump to $rev" -- forge-micro
          git push origin HEAD:master
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Trigger firmware build
        if: steps.bump.outputs.bumped == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-forge-axe.yml --ref master
