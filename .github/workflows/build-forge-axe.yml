name: Build Forge Axe firmware

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Purging superseded Nix store caches deletes them through the API.
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      # forge-micro's cross toolchain is not in any binary cache, so a
      # cold build compiles gcc on top of the firmware's store. Free space
      # differs between runner images and one run ran out of it, so drop
      # preinstalled SDKs, tool caches and container images this job
      # never uses.
      - name: Free disk space
        run: |
          df -h / /tmp
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force >/dev/null
          df -h / /tmp

      # Keep build trees on the root disk that the cleanup enlarges,
      # whatever the runner image mounts at /tmp.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            build-dir = /nix/var/nix/builds

      - name: Show build locations
        run: |
          sudo mkdir -p /nix/var/nix/builds
          nix config show build-dir
          df -h / /tmp

      # No binary cache carries forge-micro's cross toolchain or its
      # per-crate derivations, so without this every run rebuilds all of
      # them. Each commit saves the store under its own key and restores
      # the newest earlier one; the superseded caches of the ref are
      # purged so the repository stays under GitHub's 10 GB cache limit.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build master firmware
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./forge-axe/build-firmware

      - name: Build tagged firmware
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! $version =~ ^[1-9][0-9]*$ ]]; then
            echo "tag must have the form v<N>, where N is a positive decimal" >&2
            exit 64
          fi
          ./forge-axe/build-firmware "$version"

      - name: Report disk usage
        if: always()
        run: |
          df -h / /tmp
          du -sh /nix/store

      - name: Publish master prerelease
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=master-latest
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              --method PATCH \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --verify-tag \
              --prerelease \
              --title "Latest master firmware" \
              --notes "Automated firmware build from master."
          fi
          gh release upload "$tag" forge-axe/build/* --clobber

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --verify-tag \
              --title "Forge Axe firmware $tag" \
              --generate-notes
          fi
          gh release upload "$tag" forge-axe/build/* --clobber

      # Other branches only build: the artifact name carries the ref, and
      # a branch name may hold a `/` that upload-artifact refuses.
      - name: Upload firmware
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: forge-axe-${{ github.ref_name }}
          path: forge-axe/build/*
          if-no-files-found: error
