name: Build Forge Axe firmware

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build master firmware
        if: github.ref == 'refs/heads/master'
        run: ./forge-axe/build-firmware

      - name: Build tagged firmware
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! $version =~ ^[1-9][0-9]*$ ]]; then
            echo "tag must have the form v<N>, where N is a positive decimal" >&2
            exit 64
          fi
          ./forge-axe/build-firmware "$version"

      - name: Publish master prerelease
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=master-latest
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              --method PATCH \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --verify-tag \
              --prerelease \
              --title "Latest master firmware" \
              --notes "Automated firmware build from master."
          fi
          gh release upload "$tag" forge-axe/build/* --clobber

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --verify-tag \
              --title "Forge Axe firmware $tag" \
              --generate-notes
          fi
          gh release upload "$tag" forge-axe/build/* --clobber

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: forge-axe-${{ github.ref_name }}
          path: forge-axe/build/*
          if-no-files-found: error
